[package]
name = "deckme"
version = "1.0.7"
description = "AnkiDeck inspired study application for notes and flashcard decks"
authors = ["novakamiii <pauloneil3334@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/novakamiii/DeckMe"
homepage = "https://novakamiii.github.io/DeckMe/"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
