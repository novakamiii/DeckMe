<svg xmlns="http://www.w3.org/2000/svg" width="320" height="56" viewBox="0 0 320 56" role="img" aria-label="Try DeckMe in your browser">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="316" height="52" rx="16" fill="url(#g)" stroke="#15803d" stroke-width="1"/>
  <g>
    <animate attributeName="opacity" values="1;0.92;1" dur="2.4s" repeatCount="indefinite"/>
    <text x="160" y="24" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffffff">▶  Try DeckMe in your browser</text>
    <text x="160" y="42" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#dcfce7">No install required</text>
  </g>
  <rect x="2" y="2" width="316" height="52" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
</svg>
